services:
  db:
    image: mariadb:11.3
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: boatdb
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: boatdb
      DB_USER: user
      DB_PASSWORD: pass
      SECRET_KEY: dev
      # Optional: a free key from unsplash.com/developers gives nicer harbour
      # photos for cities that are not hand-picked. Without it they come from
      # the Wikipedia API instead, so leaving it unset is fine.
      UNSPLASH_ACCESS_KEY: "${UNSPLASH_ACCESS_KEY:-}"
    volumes:
      - ./backend/:/app
